apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: protectionpolicies.dr.draas.local}
spec:
  group: dr.draas.local
  names: {kind: ProtectionPolicy, plural: protectionpolicies, singular: protectionpolicy, shortNames: [drpolicy]}
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [rpoSeconds, rtoSeconds]
              properties:
                rpoSeconds: {type: integer, minimum: 60, maximum: 86400}
                rtoSeconds: {type: integer, minimum: 10, maximum: 86400}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: protectedworkloads.dr.draas.local}
spec:
  group: dr.draas.local
  names: {kind: ProtectedWorkload, plural: protectedworkloads, singular: protectedworkload, shortNames: [drworkload]}
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Workload, type: string, jsonPath: .spec.workloadID}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [tenantID, workloadID, policyRef]
              properties:
                tenantID: {type: string, pattern: '^[a-zA-Z0-9_-]{1,100}$'}
                workloadID: {type: string, pattern: '^[a-zA-Z0-9_-]{1,100}$'}
                policyRef: {type: string, maxLength: 63}
                suspended: {type: boolean, default: false}
            status:
              type: object
              properties:
                phase: {type: string}
                message: {type: string}
                observedGeneration: {type: integer, format: int64}
                lastJobID: {type: string}

