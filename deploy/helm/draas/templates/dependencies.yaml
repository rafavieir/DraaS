{{- if .Values.labDependencies }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres-data, namespace: {{ .Values.namespace }}}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: {{ .Values.namespace }}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: draas-postgres}}
  template:
    metadata: {labels: {app: draas-postgres}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:18-alpine
          env:
            - {name: POSTGRES_USER, value: draas}
            - {name: POSTGRES_DB, value: draas}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.secretName }}, key: POSTGRES_PASSWORD}}
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -U, draas, -d, draas]}, initialDelaySeconds: 5, periodSeconds: 5}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: postgres-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: {{ .Values.namespace }}}
spec: {selector: {app: draas-postgres}, ports: [{port: 5432}]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: nats-data, namespace: {{ .Values.namespace }}}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: nats, namespace: {{ .Values.namespace }}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: draas-nats}}
  template:
    metadata: {labels: {app: draas-nats}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      containers:
        - name: nats
          image: nats:2.12-alpine
          args: ["-js", "-sd", "/data", "--auth", "$(NATS_TOKEN)"]
          env:
            - name: NATS_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.secretName }}, key: NATS_TOKEN}}
          ports: [{containerPort: 4222}]
          readinessProbe: {tcpSocket: {port: 4222}, initialDelaySeconds: 3, periodSeconds: 5}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: "1", memory: 256Mi}}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: nats-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: nats, namespace: {{ .Values.namespace }}}
spec: {selector: {app: draas-nats}, ports: [{port: 4222}]}
{{- end }}
