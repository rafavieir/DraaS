{{- if .Values.observability }}
apiVersion: v1
kind: ConfigMap
metadata: {name: draas-grafana, namespace: {{ .Values.namespace }}}
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: DR Platform
        uid: draas
        type: prometheus
        access: proxy
        url: http://draas-prometheus:9090
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: draas
        type: file
        options:
          path: /var/lib/grafana/dashboards
  platform.json: |
{{ .Files.Get "files/platform.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: draas-grafana, namespace: {{ .Values.namespace }}}
spec:
  replicas: 1
  selector: {matchLabels: {app: draas-grafana}}
  template:
    metadata: {labels: {app: draas-grafana}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 472, fsGroup: 472}
      containers:
        - name: grafana
          image: grafana/grafana:12.3.0
          env:
            - {name: GF_SECURITY_ADMIN_USER, value: lab-admin}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.secretName }}, key: GRAFANA_PASSWORD}}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          ports: [{containerPort: 3000}]
          readinessProbe: {httpGet: {path: /api/health, port: 3000}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {cpu: "1", memory: 256Mi}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: config, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml}
            - {name: config, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml}
            - {name: config, mountPath: /var/lib/grafana/dashboards/platform.json, subPath: platform.json}
      volumes:
        - {name: config, configMap: {name: draas-grafana}}
        - {name: data, emptyDir: {sizeLimit: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: draas-grafana, namespace: {{ .Values.namespace }}}
spec: {selector: {app: draas-grafana}, ports: [{port: 3000}]}
{{- end }}
