{{- range list "api" "worker" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: draas-{{ . }}
  namespace: {{ $.Values.namespace }}
automountServiceAccountToken: {{ if and (eq . "worker") (or (eq $.Values.protection.backend "kubernetes-zfs") (eq $.Values.protection.backend "velero")) }}true{{ else }}false{{ end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: draas-{{ . }}
  namespace: {{ $.Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: draas-{{ . }}}
  template:
    metadata:
      labels: {app: draas-{{ . }}}
    spec:
      serviceAccountName: draas-{{ . }}
      automountServiceAccountToken: {{ if and (eq . "worker") (or (eq $.Values.protection.backend "kubernetes-zfs") (eq $.Values.protection.backend "velero")) }}true{{ else }}false{{ end }}
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ . }}
          image: {{ $.Values.image }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          command: [/usr/local/bin/draas-{{ . }}]
          envFrom: [{secretRef: {name: {{ $.Values.secretName }}}}]
          env:
            - {name: LISTEN_ADDR, value: "0.0.0.0:8080"}
            - {name: BRAND_NAME, value: {{ $.Values.brand | quote }}}
            - {name: DRAAS_STORAGE_BACKEND, value: {{ $.Values.storageBackend | quote }}}
            - {name: DRAAS_PROTECTION_BACKEND, value: {{ $.Values.protection.backend | quote }}}
            {{- if eq $.Values.protection.backend "kubernetes-zfs" }}
            - {name: DRAAS_K8S_RECOVERY_NAMESPACE, value: {{ $.Values.k8sZfs.recoveryNamespace | quote }}}
            - {name: DRAAS_K8S_ZFS_STORAGE_CLASS, value: {{ $.Values.k8sZfs.storageClass | quote }}}
            - {name: DRAAS_K8S_VALIDATOR_IMAGE, value: {{ $.Values.k8sZfs.validatorImage | quote }}}
            {{- else if eq $.Values.protection.backend "velero" }}
            - {name: DRAAS_VELERO_NAMESPACE, value: {{ $.Values.velero.namespace | quote }}}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 96Mi}
            limits: {cpu: "2", memory: 512Mi}
          volumeMounts: [{name: scratch, mountPath: /tmp}]
          {{- if eq . "api" }}
          ports: [{containerPort: 8080, name: http}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 15}
          {{- end }}
      volumes: [{name: scratch, emptyDir: {sizeLimit: 1Gi}}]
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: draas-api
  namespace: {{ .Values.namespace }}
spec:
  selector: {app: draas-api}
  ports: [{port: 8080, targetPort: http, name: http}]
